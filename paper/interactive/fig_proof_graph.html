3cbr\u003eaxioms: propext","\u003cb\u003echeckCapability\u003c\u002fb\u003e (def, Checker)\u003cbr\u003eCryoLean.checkCapability (k : CryoLean.Constraint) (c : CryoLean.Capability) :\u003cbr\u003eCryoLean.Outcome\u003cbr\u003e\u003ci\u003eCheck a constraint against one capability, honouring install status and provenance.\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003ekeyOutcome\u003c\u002fb\u003e (def, Checker)\u003cbr\u003eCryoLean.keyOutcome (cfg : CryoLean.Configuration) (k : CryoLean.Constraint) (key :\u003cbr\u003eString) : CryoLean.Outcome\u003cbr\u003e\u003ci\u003eOutcome for one key. A missing capability is `unknown`.\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003ecombineAny\u003c\u002fb\u003e (def, Checker)\u003cbr\u003eCryoLean.combineAny (os : List CryoLean.Outcome) : CryoLean.Outcome\u003cbr\u003e\u003ci\u003eDisjunction over alternative keys: pass if any passes, fail only if all fail.\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003eevalCond\u003c\u002fb\u003e (def, Checker)\u003cbr\u003eCryoLean.evalCond (cfg : CryoLean.Configuration) (e : CryoLean.Experiment) :\u003cbr\u003eCryoLean.Condition \u2192 CryoLean.CondR\u003cbr\u003e\u003ci\u003eEvaluate one applicability condition. Untrusted or missing information gives `unknown`,\u003cbr\u003enever `holds`\u002f`fails`.\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003econdsResult\u003c\u002fb\u003e (def, Checker)\u003cbr\u003eCryoLean.condsResult (cfg : CryoLean.Configuration) (e : CryoLean.Experiment) (cs : List\u003cbr\u003eCryoLean.Condition) :   CryoLean.CondR\u003cbr\u003e\u003ci\u003eA conjunction of conditions: any definite failure makes the item not applicable.\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003echeckRequirement\u003c\u002fb\u003e (def, Checker)\u003cbr\u003eCryoLean.checkRequirement (cfg : CryoLean.Configuration) (e : CryoLean.Experiment) (r :\u003cbr\u003eCryoLean.Requirement) :   CryoLean.Outcome\u003cbr\u003e\u003ci\u003eOutcome of one requirement: its conditions decide applicability, then any of its keys may\u003cbr\u003esatisfy it.\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003eevalExpr\u003c\u002fb\u003e (def, Checker)\u003cbr\u003eCryoLean.evalExpr (cfg : CryoLean.Configuration) (e : CryoLean.Experiment) : CryoLean.Expr\u003cbr\u003e\u2192 CryoLean.EvalR\u003cbr\u003e\u003ci\u003eEvaluate an expression using only usable (installed, trusted) capabilities and trusted\u003cbr\u003eparameters; additions require equal dimensions.\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003echeckLe\u003c\u002fb\u003e (def, Checker)\u003cbr\u003eCryoLean.checkLe (cfg : CryoLean.Configuration) (e : CryoLean.Experiment) (a b :\u003cbr\u003eCryoLean.Expr) : CryoLean.Outcome\u003cbr\u003e\u003ci\u003e`a \u2264 b` evaluated exactly with a dimension check.\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003evalidityOutcome\u003c\u002fb\u003e (def, Checker)\u003cbr\u003eCryoLean.validityOutcome (cfg : CryoLean.Configuration) (e : CryoLean.Experiment)   (vs :\u003cbr\u003eList (CryoLean.Expr \u00d7 CryoLean.Expr)) : CryoLean.Outcome\u003cbr\u003e\u003ci\u003eAll validity bounds of a model must hold; otherwise the model is unsupported (or unknown).\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003echeckCoupled\u003c\u002fb\u003e (def, Checker)\u003cbr\u003eCryoLean.checkCoupled (cfg : CryoLean.Configuration) (e : CryoLean.Experiment) (c :\u003cbr\u003eCryoLean.Coupled) : CryoLean.Outcome\u003cbr\u003e\u003ci\u003eOutcome of one coupled multiphysics constraint `lhs \u2264 rhs`, including its validity-range\u003cbr\u003echecks.\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003erelevantReqs\u003c\u002fb\u003e (def, Checker)\u003cbr\u003eCryoLean.relevantReqs (e : CryoLean.Experiment) : List CryoLean.Requirement\u003cbr\u003e\u003ci\u003eMandatory, applicable requirements.\u003c\u002fi\u003e\u003cbr\u003eaxioms: none","\u003cb\u0 003c\u002fb\u003e (def, Spec)\u003cbr\u003eCryoLean.SatisfiesKey (cfg : CryoLean.Configuration) (k : CryoLean.Constraint) (key :\u003cbr\u003eString) : Prop\u003cbr\u003e\u003ci\u003eThe capability under `key` is installed, trusted and meets the constraint \u2014 or the\u003cbr\u003econstraint asks for the item to be ABSENT and it is documented (trusted) as an option that\u003cbr\u003eis not fitted.\u003c\u002fi\u003e\u003cbr\u003eaxioms: none","\u003cb\u003eViolatesKey\u003c\u002fb\u003e (def, Spec)\u003cbr\u003eCryoLean.ViolatesKey (cfg : CryoLean.Configuration) (k : CryoLean.Constraint) (key :\u003cbr\u003eString) : Prop\u003cbr\u003e\u003ci\u003eThe capability under `key` is documented (trusted) as an option that is not fitted (and\u003cbr\u003ethe constraint needs it), or is fitted, trusted and demonstrably conflicts.  Every\u003cbr\u003eviolation rests on trusted evidence: untrusted records can only ever lead to\u003cbr\u003eNEED_MORE_INFORMATION.\u003c\u002fi\u003e\u003cbr\u003eaxioms: none","\u003cb\u003eCondHolds\u003c\u002fb\u003e (def, Spec)\u003cbr\u003eCryoLean.CondHolds (cfg : CryoLean.Configuration) (e : CryoLean.Experiment) :\u003cbr\u003eCryoLean.Condition \u2192 Prop\u003cbr\u003e\u003ci\u003eA condition definitely holds, judged only from trusted, installed (or trusted not-fitted)\u003cbr\u003erecords and trusted parameters.\u003c\u002fi\u003e\u003cbr\u003eaxioms: none","\u003cb\u003eCondFails\u003c\u002fb\u003e (def, Spec)\u003cbr\u003eCryoLean.CondFails (cfg : CryoLean.Configuration) (e : CryoLean.Experiment) :\u003cbr\u003eCryoLean.Condition \u2192 Prop\u003cbr\u003e\u003ci\u003eA condition definitely fails, judged only from trusted evidence (the requirement it guards\u003cbr\u003eis then not applicable).\u003c\u002fi\u003e\u003cbr\u003eaxioms: none","\u003cb\u003eDenotes\u003c\u002fb\u003e (inductive, Spec)\u003cbr\u003eCryoLean.Denotes (cfg : CryoLean.Configuration) (e : CryoLean.Experiment) : CryoLean.Expr\u003cbr\u003e\u2192 CryoLean.Quantity \u2192 Prop\u003cbr\u003e\u003ci\u003eBig-step semantics of coupled-constraint expressions: `Denotes cfg e x q` means `x`\u003cbr\u003edenotes the quantity `q` using only installed, trusted capabilities, trusted parameters,\u003cbr\u003eand dimensionally consistent additions.\u003c\u002fi\u003e\u003cbr\u003eaxioms: none","\u003cb\u003eLeHolds\u003c\u002fb\u003e (def, Spec)\u003cbr\u003eCryoLean.LeHolds (cfg : CryoLean.Configuration) (e : CryoLean.Experiment) (a b :\u003cbr\u003eCryoLean.Expr) : Prop\u003cbr\u003e\u003ci\u003e`a \u2264 b` holds for the denoted quantities, in equal dimensions.\u003c\u002fi\u003e\u003cbr\u003eaxioms: none","\u003cb\u003eLeFails\u003c\u002fb\u003e (def, Spec)\u003cbr\u003eCryoLean.LeFails (cfg : CryoLean.Configuration) (e : CryoLean.Experiment) (a b :\u003cbr\u003eCryoLean.Expr) : Prop\u003cbr\u003e\u003ci\u003e`a \u2264 b` demonstrably fails for the denoted quantities, in equal dimensions.\u003c\u002fi\u003e\u003cbr\u003eaxioms: none","\u003cb\u003eReqPasses\u003c\u002fb\u003e (def, Spec)\u003cbr\u003eCryoLean.ReqPasses (cfg : CryoLean.Configuration) (e : CryoLean.Experiment) (r :\u003cbr\u003eCryoLean.Requirement) : Prop\u003cbr\u003e\u003ci\u003eA requirement genuinely passes: all its conditions hold and some alternative key satisfies\u003cbr\u003eit.\u003c\u002fi\u003e\u003cbr\u003eaxioms: none","\u003cb\u003eReqOK\u003c\u002fb\u003e (def, Spec)\u003cbr\u003eCryoLean.ReqOK (cfg : CryoLean.Configuration) (e : CryoLean.Experiment) (r :\u003cbr\u003eCryoLean.Requirement) : Prop\u003cbr\u003e\u003ci\u003eA requirement is fine: a condition definitely fails (so it does not apply) or it passes.\u003c\u002fi\u003e\u003cbr\u003eaxioms: none","\u003cb\u003eReqViolated\u003c\u002fb\u003e (def, Spec)\u003cbr\u003eCryoLean.ReqViolated (cfg : CryoLean.Configuration) (e : CryoLean.Experiment) (r :\u003cbr\u003eCryoLean.Requirement) : Prop\u003cbr\u003e\u003ci\u003eA requirement is violated: it applies and every alternative key demonstrably violates it.\u003c\u002fi\u003e\u003cbr\u003eaxioms: none","\u003cb\u003eCoupledPasses\u003c\u002fb\u003e (def, Spec)\u003cbr\u003eCryoLean.CoupledPasses (cfg : CryoLean.Configuration) (e : CryoLean.Experiment) (c :\u003cbr\u003eCryoLean.Coupled) : Prop\u003cbr\u003e\u003ci\u003eA coupled constraint genuinely passes: it applies, its model is valid here, and `lhs \u2264\u003cbr\u003erhs`.\u003c\u002fi\u003e\u003cbr\u003eaxioms: none","\u003cb\u003eCoupledOK\u003c\u002fb\u003e (def, Spec)\u003cbr\u003eCryoLean.CoupledOK (cfg : CryoLean.Configuration) (e : CryoLean.Experiment) (c :\u003cbr\u003eCryoLean.Coupled) : Prop\u003cbr\u003e\u003ci\u003eA coupled constraint is satisfied, or is not mandatory\u002fapplicable and so imposes nothing.\u003c\u002fi\u003e\u003cbr\u003eaxioms: none","\u003cb\u003eCoupledViolated\u003c\u002fb\u003e (def, Spec)\u003cbr\u003eCryoLean.CoupledViolated (cfg : CryoLean.Configuration) (e : CryoLean.Experiment) (c :\u003cbr\u003eCryoLean.Coupled) : Prop\u003cbr\u003e\u003ci\u003eA coupled constraint is violated: it applies, its model is valid here, and `lhs \u003e rhs`.\u003c\u002fi\u003e\u003cbr\u003eaxioms: none","\u003cb\u003eAcceptSpec\u003c\u002fb\u003e (def, Spec)\u003cbr\u003eCryoLean.AcceptSpec (cfg : CryoLean.Configuration) (e : CryoLean.Experiment) : Prop\u003cbr\u003e\u003ci\u003eWhat ACCEPT is supposed to mean.\u003c\u002fi\u003e\u003cbr\u003eaxioms: none","\u003cb\u003eRejectSpec\u003c\u002fb\u003e (def, Spec)\u003cbr\u003eCryoLean.RejectSpec (cfg : CryoLean.Configuration) (e : CryoLean.Experiment) : Prop\u003cbr\u003e\u003ci\u003eWhat REJECT is supposed to mean.\u003c\u002fi\u003e\u003cbr\u003eaxioms: none"],"marker":{"color":"#7c6ee6","line":{"color":"white","width":1},"size":[9,9,9,9,9,9,9,9,9,9,9,9,9,9,9,9,9,9],"symbol":["square","square","square","square","square","square","square","square","square","square","square","square","square","square","square","square","square","square"]},"mode":"markers+text","name":"Spec","text":["TrustedEvidence","ValueMeets","ValueFails","SatisfiesKey","ViolatesKey","CondHolds","CondFails","Denotes","LeHolds","LeFails","ReqPasses","ReqOK","ReqViolated","CoupledPasses","CoupledOK","CoupledViolated","AcceptSpec","RejectSpec"],"textfont":{"color":"#0b0b0b","size":9},"textposition":["middle left","middle left","middle left","middle left","middle left","middle left","middle left","middle left","middle left","middle left","middle left","middle left","middle left","middle left","middle left","middle left","middle left","middle left"],"x":[2.5,2.5,2.5,2.5,2.5,2.5,2.5,2.5,2.5,2.5,2.5,2.5,2.5,2.5,2.5,2.5,2.5,2.5],"y":[0.7045454545454546,0.7954545454545454,0.75,0.8863636363636364,0.8409090909090909,0.6590909090909092,0.5681818181818181,0.6136363636363636,0.5227272727272727,0.4772727272727273,0.43181818181818177,0.38636363636363635,0.25,0.34090909090909094,0.2954545454545454,0.20454545454545459,0.11363636363636365,0.15909090909090906],"type":"scatter"},{"hoverinfo":"text","hovertext":["\u003cb\u003everdict_accept_sound\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.verdict_accept_sound {cfg : CryoLean.Configuration} {e : CryoLean.Experiment}\u003cbr\u003e(h : CryoLean.verdict cfg e = CryoLean.Verdict.accept) : CryoLean.AcceptSpec cfg e\u003cbr\u003e\u003ci\u003e**Main soundness theorem.** ACCEPT implies the independent specification: every applicable\u003cbr\u003emandatory requirement and every applicable mandatory coupled constraint holds (or is\u003cbr\u003eexcluded by a definitely-false condition), and at least one genuinely passes.\u003c\u002fi\u003e\u003cbr\u003eaxioms: Quot.sound, propext","\u003cb\u003eaccept_all_coupled\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.accept_all_coupled {cfg : CryoLean.Configuration} {e : CryoLean.Experiment}   (h\u003cbr\u003e: CryoLean.verdict cfg e = CryoLean.Verdict.accept) (c : CryoLean.Coupled) :   c \u2208\u003cbr\u003ee.coupled \u2192 c.mandatory = true \u2192 c.applicable = true \u2192 CryoLean.CoupledOK cfg e c\u003cbr\u003e\u003ci\u003eEvery applicable mandatory coupled constraint passed (or is excluded by a false\u003cbr\u003econdition).\u003c\u002fi\u003e\u003cbr\u003eaxioms: Quot.sound, propext","\u003cb\u003everdict_accept_complete\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.verdict_accept_complete {cfg : CryoLean.Configuration} {e : CryoLean.Experiment}\u003cbr\u003e(h : CryoLean.AcceptSpec cfg e) : CryoLean.verdict cfg e = CryoLean.Verdict.accept\u003cbr\u003e\u003ci\u003e**Completeness.** If the specification holds, the checker accepts.\u003c\u002fi\u003e\u003cbr\u003eaxioms: Quot.sound, propext","\u003cb\u003everdict_accept_iff\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.verdict_accept_iff (cfg : CryoLean.Configuration) (e : CryoLean.Experiment) :\u003cbr\u003eCryoLean.verdict cfg e = CryoLean.Verdict.accept \u2194 CryoLean.AcceptSpec cfg e\u003cbr\u003e\u003ci\u003eACCEPT holds exactly when the independent specification holds.\u003c\u002fi\u003e\u003cbr\u003eaxioms: Quot.sound, propext","\u003cb\u003everdict_reject_sound\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.verdict_reject_sound {cfg : CryoLean.Configuration} {e : CryoLean.Experiment}\u003cbr\u003e(h : CryoLean.verdict cfg e = CryoLean.Verdict.reject) : CryoLean.RejectSpec cfg e\u003cbr\u003e\u003ci\u003eREJECT implies a documented violation exists.\u003c\u002fi\u003e\u003cbr\u003eaxioms: Quot.sound, propext","\u003cb\u003everdict_reject_complete\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.verdict_reject_complete {cfg : CryoLean.Configuration} {e : CryoLean.Experiment}\u003cbr\u003e(h : CryoLean.RejectSpec cfg e) : CryoLean.verdict cfg e = CryoLean.Verdict.reject\u003cbr\u003e\u003ci\u003eREJECT is complete: a documented violation (spec level) always yields REJECT.\u003c\u002fi\u003e\u003cbr\u003eaxioms: Classical.choice, Quot.sound, propext","\u003cb\u003eaccept_no_unknown\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.accept_no_unknown {cfg : CryoLean.Configuration} {e : CryoLean.Experiment}   (h :\u003cbr\u003eCryoLean.verdict cfg e = CryoLean.Verdict.accept) (o : CryoLean.Outcome) :   o \u2208\u003cbr\u003eCryoLean.outcomes cfg e \u2192 o \u2260 CryoLean.Outcome.unknown \u2227 o \u2260 CryoLean.Outcome.unsupported\u003cbr\u003e\u003ci\u003eMissing information (`unknown`) or an unsupported requirement or physical model on any\u003cbr\u003eapplicable mandatory item blocks ACCEPT.\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003emissing_capability_unknown\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.missing_capability_unknown {cfg : CryoLean.Configuration} {k :\u003cbr\u003eCryoLean.Constraint} {key : String}   (h : CryoLean.lookup cfg key = none) :\u003cbr\u003eCryoLean.keyOutcome cfg k key = CryoLean.Outcome.unknown\u003cbr\u003e\u003ci\u003eA capability that is not recorded at all is `unknown`, never `pass`.\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003eunknown_value_never_passes\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.unknown_value_never_passes (k : CryoLean.Constraint) :   CryoLean.checkValue k\u003cbr\u003eCryoLean.CapValue.unknown \u2260 CryoLean.Outcome.pass\u003cbr\u003e\u003ci\u003e\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003eestimate_never_passes\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.estimate_never_passes {k : CryoLean.Constraint} {c : CryoLean.Capability}   (h :\u003cbr\u003ec.evidence = CryoLean.EvidenceStatus.inferredEstimate) : CryoLean.checkCapability k c \u2260\u003cbr\u003eCryoLean.Outcome.pass\u003cbr\u003e\u003ci\u003eAn inferred estimate is never treated as a verified specification.\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003eno_provenance_never_passes\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.no_provenance_never_passes {k : CryoLean.Constraint} {c : CryoLean.Capability}\u003cbr\u003e(h : c.evidence = CryoLean.EvidenceStatus.unknown) : CryoLean.checkCapability k c \u2260\u003cbr\u003eCryoLean.Outcome.pass\u003cbr\u003e\u003ci\u003eA fact with no recorded provenance never passes.\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003ecap_not_usable_missing\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.cap_not_usable_missing {cfg : CryoLean.Configuration} {e : CryoLean.Experiment}\u003cbr\u003e{key : String}   {s : CryoLean.Sel} {c : CryoLean.Capability} (hl : CryoLean.lookup cfg\u003cbr\u003ekey = some c)   (hu : CryoLean.usable c = false) : CryoLean.evalExpr cfg e\u003cbr\u003e(CryoLean.Expr.cap key s) = CryoLean.EvalR.missing key\u003cbr\u003e\u003ci\u003eA capability that is not installed (or not trusted) can never feed a coupled calculation.\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003efail_implies_reject\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.fail_implies_reject {cfg : CryoLean.Configuration} {e : CryoLean.Experiment} (hc\u003cbr\u003e: e.confirmed = true)   (h : CryoLean.Outcome.fail \u2208 CryoLean.outcomes cfg e) :\u003cbr\u003eCryoLean.verdict cfg e = CryoLean.Verdict.reject\u003cbr\u003e\u003ci\u003eA demonstrable failure of an applicable mandatory requirement or coupled constraint forces\u003cbr\u003eREJECT.\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003eviolation_prevents_accept\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.violation_prevents_accept {cfg : CryoLean.Configuration} {e :\u003cbr\u003eCryoLean.Experiment}   (h : CryoLean.RejectSpec cfg e) : CryoLean.verdict cfg e \u2260\u003cbr\u003eCryoLean.Verdict.accept\u003cbr\u003e\u003ci\u003eA confirmed incompatibility can never be accepted.\u003c\u002fi\u003e\u003cbr\u003eaxioms: Classical.choice, Quot.sound, propext","\u003cb\u003everdict_ignores_optional\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.verdict_ignores_optional (cfg : CryoLean.Configuration) (e : CryoLean.Experiment)\u003cbr\u003e:   CryoLean.verdict cfg (CryoLean.dropOptional e) = CryoLean.verdict cfg e\u003cbr\u003e\u003ci\u003eOptional requirements never influence the verdict (so they cannot block acceptance).\u003c\u002fi\u003e\u003cbr\u003eaxioms: Quot.sound, propext","\u003cb\u003everdict_ignores_nonapplicable\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.verdict_ignores_nonapplicable (cfg : CryoLean.Configuration) (e :\u003cbr\u003eCryoLean.Experiment) :   CryoLean.verdict cfg (CryoLean.dropNonApplicable e) =\u003cbr\u003eCryoLean.verdict cfg e\u003cbr\u003e\u003ci\u003eRequirements flagged not applicable never influence the verdict (no false failures).\u003c\u002fi\u003e\u003cbr\u003eaxioms: Quot.sound, propext","\u003cb\u003econdition_false_not_applicable\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.condition_false_not_applicable {cfg : CryoLean.Configuration} {e :\u003cbr\u003eCryoLean.Experiment}   {r : CryoLean.Requirement} (h : \u2203 c, c \u2208 r.conditions \u2227\u003cbr\u003eCryoLean.CondFails cfg e c) :   CryoLean.checkRequirement cfg e r =\u003cbr\u003eCryoLean.Outcome.notApplicable\u003cbr\u003e\u003ci\u003eA requirement whose condition is definitely false is not applicable \u2014 never a failure.\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003enot_installed_never_passes\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.not_installed_never_passes {k : CryoLean.Constraint} {c : CryoLean.Capability}\u003cbr\u003e(h : c.install = CryoLean.InstallStatus.optionalNotInstalled) (hk : k \u2260\u003cbr\u003eCryoLean.Constraint.flagIs false) :   CryoLean.checkCapability k c \u2260 CryoLean.Outcome.pass\u003cbr\u003e\u003ci\u003eAn optional accessory that is not fitted never passes a requirement that needs it (it only\u003cbr\u003esatisfies a requirement that the item be ABSENT).\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003eunknown_install_never_passes\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.unknown_install_never_passes {k : CryoLean.Constraint} {c : CryoLean.Capability}\u003cbr\u003e(h : c.install = CryoLean.InstallStatus.unknown) : CryoLean.checkCapability k c \u2260\u003cbr\u003eCryoLean.Outcome.pass\u003cbr\u003e\u003ci\u003eUnknown installation status never passes.\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003efail_needs_trusted\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.fail_needs_trusted {k : CryoLean.Constraint} {c : CryoLean.Capability}   (h :\u003cbr\u003eCryoLean.checkCapability k c = CryoLean.Outcome.fail) : CryoLean.TrustedEvidence\u003cbr\u003ec.evidence\u003cbr\u003e\u003ci\u003eA capability verdict of `fail` always rests on trusted evidence: records with no\u003cbr\u003eprovenance, unknown provenance or only an inferred estimate can never cause\u003cbr\u003eDOES_NOT_MEET_REQUIREMENTS.\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003euntrusted_never_passes\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.untrusted_never_passes {k : CryoLean.Constraint} {c : CryoLean.Capability}   (h :\u003cbr\u003e\u00acCryoLean.TrustedEvidence c.evidence) : CryoLean.checkCapability k c \u2260\u003cbr\u003eCryoLean.Outcome.pass\u003cbr\u003e\u003ci\u003eUntrusted evidence never passes, whatever the install status (generalises the estimate \u002f\u003cbr\u003eno-provenance lemmas, as suggested by the forensics statement-generality judge).\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003euntrusted_never_fails\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.untrusted_never_fails {k : CryoLean.Constraint} {c : CryoLean.Capability}   (h :\u003cbr\u003e\u00acCryoLean.TrustedEvidence c.evidence) : CryoLean.checkCapability k c \u2260\u003cbr\u003eCryoLean.Outcome.fail\u003cbr\u003e\u003ci\u003eUntrusted evidence never fails either: it can only yield `unknown`\u002f`unsupported`.\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003erun_binds_inputs\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.run_binds_inputs (cfg : CryoLean.Configuration) (e : CryoLean.Experiment) :\u003cbr\u003e(CryoLean.run cfg e).configurationId = cfg.id \u2227     (CryoLean.run cfg e).equipmentId =\u003cbr\u003ecfg.equipmentId \u2227       (CryoLean.run cfg e).experimentId = e.id \u2227 (CryoLean.run cfg\u003cbr\u003ee).verdict = CryoLean.verdict cfg e\u003cbr\u003e\u003ci\u003eA result carries the ids of exactly the inputs it was computed from.\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003everdict_deterministic\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.verdict_deterministic {cfg cfg' : CryoLean.Configuration} {e e' :\u003cbr\u003eCryoLean.Experiment} (h\u2081 : cfg = cfg')   (h\u2082 : e = e') : CryoLean.verdict cfg e =\u003cbr\u003eCryoLean.verdict cfg' e'\u003cbr\u003e\u003ci\u003ePlain congruence: `verdict` is a pure, total Lean function, so equal inputs give equal\u003cbr\u003everdicts. (Forensics judge note: this is not a deep fact; it is listed only so the audit\u003cbr\u003erecords that no hidden state \u2014 time, randomness, network, Z3, an LLM \u2014 can enter the\u003cbr\u003everdict. Purity itself is guaranteed by `verdict` being an ordinary Lean definition,\u003cbr\u003echecked by the kernel.)\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003erun_reports_everything\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.run_reports_everything (cfg : CryoLean.Configuration) (e : CryoLean.Experiment) :\u003cbr\u003eList.map (fun x =\u003e x.requirement) (CryoLean.run cfg e).reqs = e.requirements \u2227\u003cbr\u003eList.map (fun x =\u003e x.coupled) (CryoLean.run cfg e).coupled = e.coupled\u003cbr\u003e\u003ci\u003eEvery requirement and coupled constraint of the experiment is reported.\u003c\u002fi\u003e\u003cbr\u003eaxioms: Quot.sound, propext","\u003cb\u003ecandidates_accept_sound\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.candidates_accept_sound (cs : List CryoLean.Configuration) (e :\u003cbr\u003eCryoLean.Experiment) (r : CryoLean.Result) :   r \u2208 CryoLean.checkCandidates cs e \u2192\u003cbr\u003er.verdict = CryoLean.Verdict.accept \u2192 \u2203 c, c \u2208 cs \u2227 r.configurationId = c.id \u2227\u003cbr\u003eCryoLean.AcceptSpec c e\u003cbr\u003e\u003ci\u003eCandidates proposed by an untrusted search (Z3) are each re-checked: any candidate the\u003cbr\u003eLean checker reports as accepted satisfies the specification, and its result names it.\u003c\u002fi\u003e\u003cbr\u003eaxioms: Quot.sound, propext","\u003cb\u003ecandidates_verdicts_are_lean\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.candidates_verdicts_are_lean (cs : List CryoLean.Configuration) (e :\u003cbr\u003eCryoLean.Experiment) :   List.map (fun x =\u003e x.verdict) (CryoLean.checkCandidates cs e) =\u003cbr\u003eList.map (fun c =\u003e CryoLean.verdict c e) cs\u003cbr\u003e\u003ci\u003eZ3 cannot override a Lean rejection: the verdict reported for every candidate is the\u003cbr\u003echecker's own verdict on that exact configuration.\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003everdict_industry_irrelevant\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.verdict_industry_irrelevant (cfg : CryoLean.Configuration) (e :\u003cbr\u003eCryoLean.Experiment) (s : String) :   CryoLean.verdict cfg       { id := e.id, name :=\u003cbr\u003ee.name, industry := s, params := e.params, requirements := e.requirements,         coupled\u003cbr\u003e:= e.coupled, confirmed := e.confirmed } =     CryoLean.verdict cfg e\u003cbr\u003e\u003ci\u003eThe industry label is opaque: relabelling an experiment with ANY industry, including one\u003cbr\u003enever registered before, cannot change the verdict.  New industries cannot bypass the\u003cbr\u003egate.\u003c\u002fi\u003e\u003cbr\u003eaxioms: Quot.sound, propext","\u003cb\u003everdict_name_irrelevant\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.verdict_name_irrelevant (cfg : CryoLean.Configuration) (e : CryoLean.Experiment)\u003cbr\u003e(s : String) :   CryoLean.verdict cfg       { id := e.id, name := s, industry :=\u003cbr\u003ee.industry, params := e.params, requirements := e.requirements,         coupled :=\u003cbr\u003ee.coupled, confirmed := e.confirmed } =     CryoLean.verdict cfg e\u003cbr\u003e\u003ci\u003e\u003c\u002fi\u003e\u003cbr\u003eaxioms: Quot.sound, propext","\u003cb\u003epass_implies_dims_match\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.pass_implies_dims_match {q m : CryoLean.Quantity}   (h : CryoLean.checkValue\u003cbr\u003e(CryoLean.Constraint.atLeast q) (CryoLean.CapValue.max m) = CryoLean.Outcome.pass) :\u003cbr\u003em.dim = q.dim\u003cbr\u003e\u003ci\u003eSpecial case kept for the guarantee table: an `atLeast` against a documented maximum.\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003ecoupled_pass_dims_match\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.coupled_pass_dims_match {cfg : CryoLean.Configuration} {e : CryoLean.Experiment}\u003cbr\u003e{a b : CryoLean.Expr}   (h : CryoLean.checkLe cfg e a b = CryoLean.Outcome.pass) :   \u2203 x\u003cbr\u003ey,     CryoLean.evalExpr cfg e a = CryoLean.EvalR.ok x \u2227 CryoLean.evalExpr cfg e b =\u003cbr\u003eCryoLean.EvalR.ok y \u2227 x.dim = y.dim\u003cbr\u003e\u003ci\u003eA coupled comparison that passes was made in identical dimensions.\u003c\u002fi\u003e\u003cbr\u003eaxioms: Quot.sound, propext","\u003cb\u003epass_dims_all_match\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.pass_dims_all_match {k : CryoLean.Constraint} {v : CryoLean.CapValue}   (h :\u003cbr\u003eCryoLean.checkValue k v = CryoLean.Outcome.pass) :   \u2203 D, (\u2200 (d : CryoLean.Dim), d \u2208\u003cbr\u003ek.dims \u2192 d = D) \u2227 \u2200 (d : CryoLean.Dim), d \u2208 CryoLean.comparedDims k v \u2192 d = D\u003cbr\u003e\u003ci\u003eEVERY passing comparison (all numeric constraint shapes) happened in one single dimension:\u003cbr\u003eall quantities of the constraint and every compared bound share it (no silent unit\u003cbr\u003econversion).\u003c\u002fi\u003e\u003cbr\u003eaxioms: Quot.sound, propext","\u003cb\u003eevalExpr_sound\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.evalExpr_sound {cfg : CryoLean.Configuration} {e : CryoLean.Experiment} {x :\u003cbr\u003eCryoLean.Expr}   {q : CryoLean.Quantity} : CryoLean.evalExpr cfg e x = CryoLean.EvalR.ok q\u003cbr\u003e\u2192 CryoLean.Denotes cfg e x q\u003cbr\u003e\u003ci\u003e\u003c\u002fi\u003e\u003cbr\u003eaxioms: Quot.sound, propext","\u003cb\u003eevalExpr_complete\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.evalExpr_complete {cfg : CryoLean.Configuration} {e : CryoLean.Experiment} {x :\u003cbr\u003eCryoLean.Expr}   {q : CryoLean.Quantity} (h : CryoLean.Denotes cfg e x q) :\u003cbr\u003eCryoLean.evalExpr cfg e x = CryoLean.EvalR.ok q\u003cbr\u003e\u003ci\u003e\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003esatisfies_spec_exclusive\u003c\u002fb\u003e (theorem, Soundness)\u003cbr\u003eCryoLean.satisfies_spec_exclusive {cfg : CryoLean.Configuration} {e : CryoLean.Experiment}\u003cbr\u003e(ha : CryoLean.AcceptSpec cfg e) (hr : CryoLean.RejectSpec cfg e) : False\u003cbr\u003e\u003ci\u003eThe ACCEPT and REJECT specifications are mutually exclusive.\u003c\u002fi\u003e\u003cbr\u003eaxioms: Classical.choice, Quot.sound, propext","\u003cb\u003edropOptional\u003c\u002fb\u003e (def, Soundness)\u003cbr\u003eCryoLean.dropOptional (e : CryoLean.Experiment) : CryoLean.Experiment\u003cbr\u003e\u003ci\u003eRemove every optional requirement and optional coupled constraint.\u003c\u002fi\u003e\u003cbr\u003eaxioms: none","\u003cb\u003edropNonApplicable\u003c\u002fb\u003e (def, Soundness)\u003cbr\u003eCryoLean.dropNonApplicable (e : CryoLean.Experiment) : CryoLean.Experiment\u003cbr\u003e\u003ci\u003eRemove every requirement and coupled constraint flagged not applicable.\u003c\u002fi\u003e\u003cbr\u003eaxioms: none","\u003cb\u003ecomparedDims\u003c\u002fb\u003e (def, Soundness)\u003cbr\u003eCryoLean.comparedDims : CryoLean.Constraint \u2192 CryoLean.CapValue \u2192 List CryoLean.Dim\u003cbr\u003e\u003ci\u003eDimensions of the documented bounds `checkValue` actually compares for this\u003cbr\u003econstraint\u002fvalue pair.\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003eConstraint.dims\u003c\u002fb\u003e (def, Soundness)\u003cbr\u003eCryoLean.Constraint.dims : CryoLean.Constraint \u2192 List CryoLean.Dim\u003cbr\u003e\u003ci\u003eDimensions of the quantities a constraint mentions.\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext"],"marker":{"color":"#2fa9d9","line":{"color":"white","width":1},"size":[11,11,11,11,11,11,11,11,11,11,11,11,11,11,11,11,11,11,11,11,11,11,11,11,11,11,11,11,11,11,11,11,11,11,11,9,9,9,9],"symbol":["circle","circle","circle","circle","circle","circle","circle","circle","circle","circle","circle","circle","circle","circle","circle","circle","circle","circle","circle","circle","circle","circle","circle","circle","circle","circle","circle","circle","circle","circle","circle","circle","circle","circle","circle","square","square","square","square"]},"mode":"markers+text","name":"Soundness","text":["verdict_accept_sound","accept_all_coupled","verdict_accept_complete","verdict_accept_iff","verdict_reject_sound","verdict_reject_complete","accept_no_unknown","missing_capability_unknown","unknown_value_never_passes","estimate_never_passes","no_provenance_never_passes","cap_not_usable_missing","fail_implies_reject","violation_prevents_accept","verdict_ignores_optional","verdict_ignores_nonapplicable","condition_false_not_applicable","not_installed_never_passes","unknown_install_never_passes","fail_needs_trusted","untrusted_never_passes","untrusted_never_fails","run_binds_inputs","verdict_deterministic","run_reports_everything","candidates_accept_sound","candidates_verdicts_are_lean","verdict_industry_irrelevant","verdict_name_irrelevant","pass_implies_dims_match","coupled_pass_dims_match","pass_dims_all_match","evalExpr_sound","evalExpr_complete","satisfies_spec_exclusive","dropOptional","dropNonApplicable","comparedDims","Constraint.dims"],"textfont":{"color":"#0b0b0b","size":9},"textposition":["middle right","middle right","middle right","middle right","middle right","middle right","middle right","middle right","middle right","middle right","middle right","middle right","middle right","middle right","middle right","middle right","middle right","middle right","middle right","middle right","middle right","middle right","middle right","middle right","middle right","middle right","middle right","middle right","middle right","middle right","middle right","middle right","middle right","middle right","middle right","middle left","middle left","middle left","middle left"],"x":[2.8,2.8,2.8,2.8,2.8,2.8,2.8,2.8,2.8,2.8,2.8,2.8,2.8,2.8,2.8,2.8,2.8,2.8,2.8,2.8,2.8,2.8,2.8,2.8,2.8,2.8,2.8,2.8,2.8,2.8,2.8,2.8,2.8,2.8,2.8,2.5,2.5,2.5,2.5],"y":[0.44285714285714284,0.5285714285714286,0.41428571428571426,0.2142857142857143,0.3571428571428571,0.3285714285714286,0.5,0.8142857142857143,0.8714285714285714,0.9285714285714286,0.9,0.7,0.4714285714285714,0.24285714285714288,0.18571428571428572,0.09999999999999998,0.5571428571428572,0.9857142857142858,0.9571428571428572,0.7285714285714286,0.7571428571428571,0.7857142857142857,0.12857142857142856,0.3857142857142857,0.042857142857142816,0.014285714285714235,0.0714285714285714,0.30000000000000004,0.27142857142857146,0.6714285714285715,0.5857142857142856,0.8428571428571429,0.6428571428571428,0.6142857142857143,0.15714285714285714,0.06818181818181823,0.022727272727272707,0.9318181818181819,0.9772727272727273],"type":"scatter"},{"hoverinfo":"text","hovertext":["\u003cb\u003evalidSchedule_sound\u003c\u002fb\u003e (theorem, Schedule)\u003cbr\u003eCryoLean.validSchedule_sound {cfg : CryoLean.Configuration} {exps : List\u003cbr\u003eCryoLean.Experiment}   {slots : List CryoLean.Slot} {L : CryoLean.Quantity} (h :\u003cbr\u003eCryoLean.validSchedule cfg exps slots L = true) :   CryoLean.ScheduleOK cfg exps slots L\u003cbr\u003e\u003ci\u003e\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003evalidSchedule_complete\u003c\u002fb\u003e (theorem, Schedule)\u003cbr\u003eCryoLean.validSchedule_complete {cfg : CryoLean.Configuration} {exps : List\u003cbr\u003eCryoLean.Experiment}   {slots : List CryoLean.Slot} {L : CryoLean.Quantity} (h :\u003cbr\u003eCryoLean.ScheduleOK cfg exps slots L) :   CryoLean.validSchedule cfg exps slots L = true\u003cbr\u003e\u003ci\u003e\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003evalidSchedule_bounds\u003c\u002fb\u003e (theorem, Schedule)\u003cbr\u003eCryoLean.validSchedule_bounds {cfg : CryoLean.Configuration} {exps : List\u003cbr\u003eCryoLean.Experiment}   {slots : List CryoLean.Slot} {L : CryoLean.Quantity} (h :\u003cbr\u003eCryoLean.validSchedule cfg exps slots L = true) :   \u2203 ps cd,     CryoLean.resolve exps\u003cbr\u003eslots = some ps \u2227       CryoLean.cooldownOf cfg = some cd \u2227 \u2200 (p : CryoLean.Placed), p \u2208\u003cbr\u003eps \u2192 cd.val.le p.start \u2227 p.stop.le L.val\u003cbr\u003e\u003ci\u003eEvery slot of a valid schedule lies inside [cooldown, run length].\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003evalidSchedule_disjoint\u003c\u002fb\u003e (theorem, Schedule)\u003cbr\u003eCryoLean.validSchedule_disjoint {cfg : CryoLean.Configuration} {exps : List\u003cbr\u003eCryoLean.Experiment}   {slots : List CryoLean.Slot} {L : CryoLean.Quantity} (h :\u003cbr\u003eCryoLean.validSchedule cfg exps slots L = true) :   \u2203 ps, CryoLean.resolve exps slots =\u003cbr\u003esome ps \u2227 List.Pairwise CryoLean.Disjoint ps\u003cbr\u003e\u003ci\u003eThe slots of a valid schedule are pairwise disjoint.\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003evalidSchedule_only_accepted\u003c\u002fb\u003e (theorem, Schedule)\u003cbr\u003eCryoLean.validSchedule_only_accepted {cfg : CryoLean.Configuration} {exps : List\u003cbr\u003eCryoLean.Experiment}   {slots : List CryoLean.Slot} {L : CryoLean.Quantity} (h :\u003cbr\u003eCryoLean.validSchedule cfg exps slots L = true)   (e : CryoLean.Experiment) : e \u2208 exps \u2192\u003cbr\u003eCryoLean.AcceptSpec cfg e\u003cbr\u003e\u003ci\u003eOnly experiments that the proven checker ACCEPTS on this configuration can be scheduled.\u003c\u002fi\u003e\u003cbr\u003eaxioms: Quot.sound, propext","\u003cb\u003evalidSchedule_rejects_unaccepted\u003c\u002fb\u003e (theorem, Schedule)\u003cbr\u003eCryoLean.validSchedule_rejects_unaccepted {cfg : CryoLean.Configuration} {exps : List\u003cbr\u003eCryoLean.Experiment}   {slots : List CryoLean.Slot} {L : CryoLean.Quantity} {e :\u003cbr\u003eCryoLean.Experiment} (he : e \u2208 exps)   (hv : CryoLean.verdict cfg e \u2260\u003cbr\u003eCryoLean.Verdict.accept) : CryoLean.validSchedule cfg exps slots L = false\u003cbr\u003e\u003ci\u003eA schedule that includes an experiment Lean does not accept is always rejected.\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003eresolve_ids\u003c\u002fb\u003e (theorem, Schedule)\u003cbr\u003eCryoLean.resolve_ids {exps : List CryoLean.Experiment} {slots : List CryoLean.Slot} {ps :\u003cbr\u003eList CryoLean.Placed} :   CryoLean.resolve exps slots = some ps \u2192 List.map (fun x =\u003e\u003cbr\u003ex.experimentId) ps = List.map (fun x =\u003e x.id) exps\u003cbr\u003e\u003ci\u003eResolution respects order and ids: the i-th slot belongs to the i-th experiment.\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003ecooldownOf\u003c\u002fb\u003e (def, Schedule)\u003cbr\u003eCryoLean.cooldownOf (cfg : CryoLean.Configuration) : Option CryoLean.Quantity\u003cbr\u003e\u003ci\u003eThe documented cooldown time of the configuration (a `min`-shaped bound, lower is better).\u003c\u002fi\u003e\u003cbr\u003eaxioms: propext","\u003cb\u003edurationOf\u003c\u002fb\u003e (def, Schedu
